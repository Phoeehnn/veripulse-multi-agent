# A-v1.1-C1 草稿：未获作者定稿，仅供规则讨论。
# 命中仅表示文本匹配，不能独立证明违法、诈骗、虚假或具体个人隐私泄露。
# 以下严重度均为候选；直接上生产计分仍需另行确认。
rules:
  - id: C01
    category: 疑似绝对疗效表述
    severity: 中
    keywords: [包治百病, 治愈率100%, 保证根治]
    note: 检出绝对疗效相关措辞，需结合上下文核实。
  - id: C02
    category: 疑似无风险收益承诺表述
    severity: 中
    keywords: [稳赚不赔, 保本高收益, 保证收益]
    note: 检出收益保证相关措辞，需结合上下文核实。
  - id: C03
    category: 疑似索要敏感验证信息表述
    severity: 中
    pattern: '(?:请|立即|现在|务必|赶紧)(?:(?:把|将)(?:验证码|银行卡密码)(?:发给|发送给|告诉|提供给|交给)(?:我们|我|客服|工作人员)|(?:向|给)(?:我们|我|客服|工作人员)(?:发送|提供|提交)(?:验证码|银行卡密码)|(?:发送|提供|提交)(?:验证码|银行卡密码)(?:给|至)(?:我们|我|客服|工作人员))'
    note: 检出包含验证信息、交付动作和指定接收对象的短句，需核对上下文。
  - id: C04
    category: 疑似诱导转入安全账户表述
    severity: 中
    pattern: '(?:请|立即|现在|务必|赶紧)(?:(?:把|将)(?:钱|资金|款项)(?:转入|转到|汇入|转账到)(?:安全账户|安全账号)|(?:转账到|转入|汇入|转到)(?:安全账户|安全账号)|向(?:安全账户|安全账号)(?:转账|汇款))'
    note: 检出包含转账动作和所谓安全账户的短句，需核对上下文。
